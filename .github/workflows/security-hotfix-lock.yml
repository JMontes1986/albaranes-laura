name: Validate security hotfix dependencies
on:
  push:
    branches:
      - security/2026-10-23-nextjs-hotfix
    paths:
      - .github/workflows/security-hotfix-lock.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: security-hotfix-lockfile
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: security/2026-10-23-nextjs-hotfix
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synced lockfile to security branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile change'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'security: synchronize npm lockfile'
            git push origin HEAD:security/2026-10-23-nextjs-hotfix
          fi
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build --if-present
